name: Desktop checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, platform: darwin, arch: arm64 }
          - { os: macos-15-intel, platform: darwin, arch: x64 }
          - { os: windows-latest, platform: win32, arch: x64 }
          - { os: windows-11-arm, platform: win32, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify the native platform and architecture
        run: node -e "const a=require('node:assert/strict');a.equal(process.platform,'${{ matrix.platform }}');a.equal(process.arch,'${{ matrix.arch }}');"
      - name: Reuse portable model weights; inference re-verifies their hash
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/companion-models
          key: companion-gguf-v1-${{ hashFiles('src/catalog.cjs') }}
          enableCrossOsArchive: true
      - run: npm ci
      - run: npm test
      - run: npm run test:inference
        env:
          COMPANION_VALIDATION_MODELS: ${{ runner.temp }}/companion-models
      - run: npm run test:tools
        env:
          COMPANION_VALIDATION_MODELS: ${{ runner.temp }}/companion-models
      - run: npm run test:desktop
        env:
          COMPANION_VALIDATION_MODELS: ${{ runner.temp }}/companion-models
      - run: npm run test:computer
      - run: npm run package
      - run: npm run test:packaged
        env:
          COMPANION_VALIDATION_MODELS: ${{ runner.temp }}/companion-models
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-installer-${{ matrix.os }}
          retention-days: 3
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
            .validation/computer-*.json
