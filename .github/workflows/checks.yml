name: Desktop checks
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/companion-models
          key: companion-gguf-v1-${{ hashFiles('src/catalog.cjs') }}
          enableCrossOsArchive: true
      - run: npm ci --no-audit --no-fund
      - run: npm run test:inference
        env:
          COMPANION_VALIDATION_MODELS: ${{ runner.temp }}/companion-models
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42288383679
          name: signed-macos-latest
          path: dist
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42288383679
          name: verified-mac-upgrade-target-ARM64
          path: upgrade-target
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42288383679
          name: verified-mac-upgrade-target-X64
          path: other-upgrade-target
      - name: Diagnose the exact signed root-installed upgrade
        timeout-minutes: 8
        run: npm run test:upgrade
        env:
          COMPANION_VALIDATION_MODELS: ${{ runner.temp }}/companion-models
          COMPANION_UPGRADE_SYSTEM_INSTALL: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-pkg-upgrade-diagnostic
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
          path: .validation/upgrade-*
