name: Desktop checks
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, arch: ARM64, other_arch: X64, journey: published}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Use the owned Intel Apple ticket transport
        if: runner.arch == 'X64'
        run: python3 scripts/ci-notary-transport.py setup
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/companion-models
          key: companion-gguf-v1-${{ hashFiles('src/catalog.cjs') }}
          enableCrossOsArchive: true
      - run: npm ci --no-audit --no-fund
      - run: npm run native:build
      - name: Verify normal input permission for the external test driver
        run: node -e "const a=require('./src/native/mac-computer.node').access();console.log(a);if(!a.accessibility||!a.postEvents)throw Error('Normal native CI input access is required.');"
      - run: npm run test:inference
        env:
          COMPANION_VALIDATION_MODELS: ${{ runner.temp }}/companion-models
      - name: Inspect and checksum the previous public installer
        if: matrix.journey == 'published'
        run: node scripts/prepare-public-upgrade.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: matrix.journey == 'candidate'
        with:
          github-token: ${{ github.token }}
          run-id: 42307226102
          name: signed-${{ matrix.os }}
          path: dist
      - uses: actions/download-artifact@v4
        if: matrix.journey == 'candidate'
        with:
          github-token: ${{ github.token }}
          run-id: 42307226102
          name: verified-mac-upgrade-target-${{ matrix.arch }}
          path: upgrade-target
      - uses: actions/download-artifact@v4
        if: matrix.journey == 'candidate'
        with:
          github-token: ${{ github.token }}
          run-id: 42307226102
          name: verified-mac-upgrade-target-${{ matrix.other_arch }}
          path: other-upgrade-target
      - uses: actions/download-artifact@v4
        if: matrix.journey == 'published'
        with:
          github-token: ${{ github.token }}
          run-id: 42307226102
          name: signed-macos-latest
          path: upgrade-target
      - uses: actions/download-artifact@v4
        if: matrix.journey == 'published'
        with:
          github-token: ${{ github.token }}
          run-id: 42307226102
          name: signed-macos-15-intel
          path: other-upgrade-target
      - name: Qualify retained signed root-installed update bytes
        timeout-minutes: 8
        run: npm run test:upgrade
        env:
          COMPANION_VALIDATION_MODELS: ${{ runner.temp }}/companion-models
          COMPANION_UPGRADE_SYSTEM_INSTALL: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retained-ready-user-${{ matrix.os }}-${{ matrix.journey }}
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn
          path: |
            .validation/upgrade-*
            dist/upgrade-proof.json
      - name: Verify Intel transport cleanup
        if: always() && runner.arch == 'X64'
        run: python3 scripts/ci-notary-transport.py cleanup
