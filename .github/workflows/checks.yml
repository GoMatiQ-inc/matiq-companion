name: Desktop checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      COMPANION_FIXTURE_LAYOUT_DIAGNOSTIC: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:computer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-layout-comparison
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
          path: .validation/
