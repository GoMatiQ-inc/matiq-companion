name: Publish verified Mac installer
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful signed qualification run with upgrade proof
        required: true
permissions:
  contents: read
concurrency: publish-verified-mac
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require trusted qualification and exact verified artifact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          python3 - <<'PYTHON'
          import hashlib,json,os,pathlib,re,subprocess
          def gh(*args): return subprocess.check_output(['gh',*args],text=True)
          repo=os.environ['GITHUB_REPOSITORY'];run_id=os.environ['SOURCE_RUN']
          assert re.fullmatch(r'[0-9]+',run_id),'Use a numeric signed qualification run ID.'
          run=json.loads(gh('api',f'repos/{repo}/actions/runs/{run_id}'))
          assert run['conclusion']=='success' and run['path']=='.github/workflows/release.yml','Require a successful signed qualification workflow.'
          assert run['head_repository']['full_name']==repo,'Fork artifacts are not publishable.'
          sha=run['head_sha'];subprocess.run(['git','merge-base','--is-ancestor',sha,'origin/main'],check=True)
          jobs=json.loads(gh('api',f'repos/{repo}/actions/runs/{run_id}/jobs?per_page=100'))['jobs']
          for os_name in ['macos-latest','macos-15-intel']:
              assert any(j['name']==f'signed ({os_name})' and j['conclusion']=='success' for j in jobs),'Require native signing on both Mac architectures.'
              assert any(j['name']==f'upgrade ({os_name})' and j['conclusion']=='success' for j in jobs),'Require actual signed upgrades on both Mac architectures.'
          assert any(j['name']=='published-upgrade' and j['conclusion']=='success' for j in jobs),'Require public-release to candidate upgrade qualification.'
          checks=json.loads(gh('api',f'repos/{repo}/actions/workflows/checks.yml/runs?head_sha={sha}&status=completed&per_page=20'))['workflow_runs']
          assert any(r['head_sha']==sha and r['conclusion']=='success' for r in checks),'Require native platform CI on the exact source commit.'
          metadata=json.loads(subprocess.check_output(['git','show',f'{sha}:package.json'],text=True));version=metadata['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+',version) and metadata['build']['appId']=='com.matiq.companion','Require the Companion identity and a stable three-part version.'
          for os_name,arch,runner_arch in [('macos-latest','arm64','ARM64'),('macos-15-intel','x64','X64')]:
              folder=f'qualified-assets/{arch}'
              gh('run','download',run_id,'--repo',repo,'--name',f'signed-{os_name}','--dir',folder)
              gh('run','download',run_id,'--repo',repo,'--name',f'mac-upgrade-proof-{runner_arch}','--dir',folder)
          gh('run','download',run_id,'--repo',repo,'--name','published-mac-upgrade-proof','--dir','qualified-assets/public-upgrade')
          pathlib.Path('qualified-assets/public-upgrade/upgrade-proof.json').rename('qualified-assets/published-upgrade-proof.json')
          subprocess.run(['git','checkout',sha,'--','scripts/prepare-mac-release.mjs','scripts/verify-update-assets.mjs','package.json','package-lock.json'],check=True)
          subprocess.run(['npm','ci','--ignore-scripts','--no-audit','--no-fund'],check=True)
          subprocess.run(['node','scripts/prepare-mac-release.mjs'],check=True)
          notes=f"""MatiQ Companion {version} — signed Mac installers

          Download the **mac-arm64.pkg** installer for Apple Silicon, or **mac-x64.pkg** for Intel. Requires macOS 14.2 or later. Local chat models download separately during setup.

          Both architectures passed native model inference, Office/file tools, real screen OCR and native pointer/Unicode/key input in development and packaged apps. Both installers and update ZIPs passed Developer ID, Apple notarization, stapling and Gatekeeper checks. Signed download/restart tests retained projects, settings, generated files and model hashes. The current public Apple Silicon release also upgraded into these exact candidate bytes.

          [Verified qualification]({run['html_url']}); source `{sha}`. Computer actions require per-project enablement, individual approval and macOS Screen Recording/Accessibility permissions.

          Voice model sharing requires a Voice version containing the family model-store bridge. Speech and chat models remain distinct. Windows signed distribution awaits Microsoft identity approval and its certificate profile.

          Free personal and internal business use under the [MatiQ Companion No-Sale License](https://github.com/{repo}/blob/{sha}/LICENSE). Third-party code and model weights retain their own licenses.
          """
          pathlib.Path('release-assets/RELEASE_NOTES.md').write_text(notes)
          with open(os.environ['GITHUB_ENV'],'a') as env: env.write(f'RELEASE_TAG=v{version}\nSOURCE_SHA={sha}\n')
          PYTHON
      - name: Publish verified Mac installer and update assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release create "$RELEASE_TAG" release-assets/*.pkg release-assets/*.zip release-assets/*.blockmap release-assets/latest-mac.yml release-assets/SHA256SUMS.txt \
            --target "$SOURCE_SHA" --title "MatiQ Companion $RELEASE_TAG — signed Mac installer" --notes-file release-assets/RELEASE_NOTES.md --latest
